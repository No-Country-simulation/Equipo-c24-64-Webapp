server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  application:
    name: "Gestion De Reservas"

  profiles:
    active: prod  # o 'prod' para producción

  spring:
    datasource:
      url: jdbc:postgresql://localhost:5432/reservas
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect